<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Tracker - Neat Layout</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
header { background: #4CAF50; color: white; padding: 1rem; text-align: center; }
main { padding: 1rem; max-width: 1400px; margin: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border: 1px solid #ccc; padding: 0.4rem; text-align: left; vertical-align: middle; word-wrap: break-word; }
th { background: #eee; }
tr.job-row.complete { background: #ffffcc; }
tr.job-row.paid { background: #ccffcc; }
tr.material-row { background: #f0f0f0; }
.material-row td { padding-left: 1rem; }
button { padding: 0.3rem 0.6rem; margin: 0.1rem; cursor: pointer; }
input, select { width: 100%; box-sizing: border-box; padding: 0.2rem; margin:0; border:none; background:transparent; }
#nav { margin-bottom: 1rem; }
#nav button { background: #4CAF50; color: white; border: none; }
</style>
</head>
<body>
<header>
<h1>Job Tracker - Neat Layout</h1>
</header>
<main>
<div id="nav">
<button onclick="showSection('jobsSection')">Jobs</button>
<button onclick="showSection('reportsSection')">Reports</button>
</div>

<section id="jobsSection">
<button onclick="addNewJob()">Add Job</button>
<button onclick="calculateSelectedTotal()">Total Selected</button>
<button onclick="markSelectedPaid()">Mark Selected Paid</button>
<button onclick="resetData()">Reset All Data</button>
<button onclick="exportData()">Export JSON</button>
<input type="file" id="importFile" onchange="importData(event)">
<table id="jobsTable">
<thead>
<tr>
<th style="width:3%;">Select</th>
<th style="width:12%;">Customer</th>
<th style="width:15%;">Description</th>
<th style="width:10%;">Start</th>
<th style="width:10%;">End</th>
<th style="width:5%;">Hours</th>
<th style="width:5%;">Rate</th>
<th style="width:8%;">Labor</th>
<th style="width:8%;">Materials</th>
<th style="width:8%;">Total</th>
<th style="width:10%;">Status</th>
<th style="width:6%;">Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>
</section>

<section id="reportsSection" class="hidden">
<h2>Reports</h2>
<p>Total Jobs: <span id="totalJobs">0</span></p>
<p>Total Labor: $<span id="totalLabor">0</span></p>
<p>Total Materials: $<span id="totalMaterials">0</span></p>
<p>Total Income: $<span id="totalIncome">0</span></p>
<p>Total Paid: $<span id="totalPaid">0</span></p>
<p>Total Pending: $<span id="totalPending">0</span></p>
</section>

<script>
let jobs = JSON.parse(localStorage.getItem('jobs')) || [];

function showSection(id){
  document.getElementById('jobsSection').classList.add('hidden');
  document.getElementById('reportsSection').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
  if(id==='jobsSection') renderJobsTable();
  if(id==='reportsSection') renderReports();
}

function saveData(){ localStorage.setItem('jobs', JSON.stringify(jobs)); }

function addNewJob(){
  const newJob={id:Date.now(), customer:'', description:'', startTime:'', endTime:'',
    hoursWorked:0, laborRate:0, materials:[], status:'In Progress', createdAt:new Date().toISOString()};
  jobs.push(newJob); saveData(); renderJobsTable();
}

function renderJobsTable(){
  const tbody=document.querySelector('#jobsTable tbody'); 
  tbody.innerHTML='';
  jobs.forEach(job=>{
    const laborCost=job.hoursWorked*job.laborRate;
    const materialsCost=job.materials.reduce((s,m)=>s+m.qty*m.price,0);
    const total=laborCost+materialsCost;

    // Job row
    const row=document.createElement('tr');
    row.className='job-row '+(job.status==='Complete'?'complete':job.status==='Paid'?'paid':'');
    row.dataset.jobId=job.id;
    row.innerHTML=`
      <td><input type="checkbox" data-id="${job.id}"></td>
      <td><input value="${job.customer}" data-field="customer"></td>
      <td><input value="${job.description}" data-field="description"></td>
      <td><input type="datetime-local" value="${job.startTime}" data-field="startTime"></td>
      <td><input type="datetime-local" value="${job.endTime}" data-field="endTime"></td>
      <td><input type="number" min="0" step="0.1" value="${job.hoursWorked}" data-field="hoursWorked"></td>
      <td><input type="number" min="0" step="0.01" value="${job.laborRate}" data-field="laborRate"></td>
      <td class="labor-cell">${laborCost.toFixed(2)}</td>
      <td class="materials-cell">${materialsCost.toFixed(2)}</td>
      <td class="total-cell">${total.toFixed(2)}</td>
      <td>
        <select data-field="status">
          <option value="In Progress"${job.status==='In Progress'?' selected':''}>In Progress</option>
          <option value="Complete"${job.status==='Complete'?' selected':''}>Complete</option>
          <option value="Paid"${job.status==='Paid'?' selected':''}>Paid</option>
        </select>
      </td>
      <td><button class="delete-btn">Delete</button></td>
    `;
    tbody.appendChild(row);

    // Material rows
    job.materials.forEach((m,index)=>{
      const matRow=document.createElement('tr');
      matRow.className='material-row';
      matRow.dataset.jobId=job.id;
      matRow.dataset.matIndex=index;
      matRow.innerHTML=`
        <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
        <td><input value="${m.name}" data-field="name"></td>
        <td><input type="number" min="0" step="0.1" value="${m.qty}" data-field="qty"></td>
        <td><input type="number" min="0" step="0.01" value="${m.price}" data-field="price"></td>
        <td><button class="remove-mat-btn">Remove</button></td>
      `;
      tbody.appendChild(matRow);
    });

    // Add material button row
    const addMatRow=document.createElement('tr');
    addMatRow.className='material-row';
    addMatRow.dataset.jobId=job.id;
    addMatRow.innerHTML=`
      <td colspan="7"></td>
      <td colspan="4"><button class="add-mat-btn">Add Material</button></td>
    `;
    tbody.appendChild(addMatRow);
  });
}

// Event delegation for inputs
document.querySelector('#jobsTable tbody').addEventListener('input', e=>{
  const input=e.target;
  const row=input.closest('tr');
  if(row.classList.contains('material-row')){
    const jobId=parseInt(row.dataset.jobId);
    const matIndex=parseInt(row.dataset.matIndex);
    const field=input.dataset.field;
    jobs=jobs.map(j=>{ if(j.id===jobId){ j.materials[matIndex][field]=field==='qty'||field==='price'?parseFloat(input.value)||0:input.value; } return j; });
    updateRowCalculations(jobId);
  } else {
    const jobId=parseInt(row.dataset.jobId);
    const field=input.dataset.field;
    jobs=jobs.map(j=>{ if(j.id===jobId){ j[field]=field==='hoursWorked'||field==='laborRate'?parseFloat(input.value)||0:input.value; } return j; });
    updateRowCalculations(jobId);
  }
  saveData();
});

// Status change
document.querySelector('#jobsTable tbody').addEventListener('change', e=>{
  const select=e.target;
  const row=select.closest('tr');
  if(select.tagName==='SELECT'){
    const jobId=parseInt(row.dataset.jobId);
    jobs=jobs.map(j=>{ if(j.id===jobId){ j.status=select.value; } return j; });
    saveData(); renderJobsTable();
  }
});

// Buttons
document.querySelector('#jobsTable tbody').addEventListener('click', e=>{
  const btn=e.target;
  const row=btn.closest('tr');
  const jobId=parseInt(row.dataset.jobId);
  if(btn.classList.contains('delete-btn')){ jobs=jobs.filter(j=>j.id!==jobId); saveData(); renderJobsTable(); }
  if(btn.classList.contains('add-mat-btn')){
    jobs=jobs.map(j=>{ if(j.id===jobId){ j.materials.push({name:'', qty:0, price:0}); } return j; }); saveData(); renderJobsTable();
  }
  if(btn.classList.contains('remove-mat-btn')){
    const matIndex=parseInt(row.dataset.matIndex);
    jobs=jobs.map(j=>{ if(j.id===jobId){ j.materials.splice(matIndex,1); } return j; }); saveData(); renderJobsTable();
  }
});

function updateRowCalculations(jobId){
  const job=jobs.find(j=>j.id===jobId);
  const rows=document.querySelectorAll(`#jobsTable tbody tr`);
  const laborCost=job.hoursWorked*job.laborRate;
  const materialsCost=job.materials.reduce((s,m)=>s+m.qty*m.price,0);
  const total=laborCost+materialsCost;
  rows.forEach(row=>{
    if(parseInt(row.dataset.jobId)===jobId && row.classList.contains('job-row')){
      row.querySelector('.labor-cell').innerText=laborCost.toFixed(2);
      row.querySelector('.materials-cell').innerText=materialsCost.toFixed(2);
      row.querySelector('.total-cell').innerText=total.toFixed(2);
    }
  });
}

function calculateSelectedTotal(){
  const selectedIds=Array.from(document.querySelectorAll('#jobsTable tbody input[type=checkbox]:checked')).map(cb=>parseInt(cb.dataset.id));
  let total=0;
  selectedIds.forEach(id=>{ const job=jobs.find(j=>j.id===id); if(job){ const labor=job.hoursWorked*job.laborRate; const materials=job.materials.reduce((s,m)=>s+m.qty*m.price,0); total+=labor+materials; }});
  alert(`Total for selected jobs: $${total.toFixed(2)}`);
}

function markSelectedPaid(){ 
  const selectedIds=Array.from(document.querySelectorAll('#jobsTable tbody input[type=checkbox]:checked')).map(cb=>parseInt(cb.dataset.id)); 
  jobs=jobs.map(j=>selectedIds.includes(j.id)?{...j,status:'Paid'}:j); 
  saveData(); renderJobsTable(); 
}

function renderReports(){
  const totalJobs=jobs.length;
  const totalLabor=jobs.reduce((s,j)=>s+j.hoursWorked*j.laborRate,0);
  const totalMaterials=jobs.reduce((s,j)=>s+j.materials.reduce((ss,m)=>ss+m.qty*m.price,0),0);
  const totalIncome=totalLabor+totalMaterials;
  const totalPaid=jobs.filter(j=>j.status==='Paid').reduce((s,j)=>s+j.hoursWorked*j.laborRate+j.materials.reduce((ss,m)=>ss+m.qty*m.price,0),0);
  const totalPending=totalIncome-totalPaid;
  document.getElementById('totalJobs').innerText=totalJobs;
  document.getElementById('totalLabor').innerText=totalLabor.toFixed(2);
  document.getElementById('totalMaterials').innerText=totalMaterials.toFixed(2);
  document.getElementById('totalIncome').innerText=totalIncome.toFixed(2);
  document.getElementById('totalPaid').innerText=totalPaid.toFixed(2);
  document.getElementById('totalPending').innerText=totalPending.toFixed(2);
}

function resetData(){ if(confirm("Delete all data?")){ jobs=[]; saveData(); renderJobsTable(); } }
function exportData(){ const blob=new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='jobs_data.json'; a.click(); URL.revokeObjectURL(url); }
function importData(e){ const file=e.target.files[0]; if(file){ const reader=new FileReader(); reader.onload=ev=>{ try{ const imported=JSON.parse(ev.target.result); if(Array.isArray(imported)){ jobs=imported; saveData(); renderJobsTable(); alert('Data imported'); } else alert('Invalid format'); } catch(err){alert('Error reading file');} }; reader.readAsText(file); } }

renderJobsTable();
</script>
v0.3.2
</body>
</html>
